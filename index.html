<title>Frutas Insha 3 Allah — Frutería en Madrid</title>
<style>
  :root{--verde:#2f7d22;--verde-osc:#225c17;--verde-claro:#eaf4e3;--naranja:#f08c00}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#262626;background:#fbfdf9;min-height:100vh;padding-bottom:90px}
  img{display:block}
  .fi-header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
  .fi-brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
  .fi-mark{width:40px;height:40px;border-radius:50%;background:var(--verde);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
  .fi-brand b{display:block;font-size:.98rem;color:var(--verde-osc);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fi-brand span{font-size:.68rem;color:#888;letter-spacing:.5px}
  .fi-switch{display:flex;background:var(--verde-claro);border-radius:30px;padding:3px;flex-shrink:0}
  .fi-switch button{border:none;background:transparent;padding:8px 14px;border-radius:30px;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--verde-osc)}
  .fi-switch button.on{background:var(--verde);color:#fff}
  .fi-hero{background:linear-gradient(120deg,var(--verde-claro),#fff);padding:26px 18px}
  .fi-hero h1{font-size:1.5rem;color:var(--verde-osc);line-height:1.2;margin:0 0 6px}
  .fi-hero p{color:#666;font-size:.92rem;margin:0}
  .fi-search{padding:14px 16px 4px}
  .fi-search input{width:100%;padding:12px 16px;border-radius:30px;border:1px solid #ddd;font-size:.95rem;outline:none}
  .fi-search input:focus{border-color:var(--verde)}
  .fi-cats{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
  .fi-cats button{flex-shrink:0;border:1px solid #e0e0e0;background:#fff;border-radius:30px;padding:8px 14px;font-weight:600;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:6px;color:#444}
  .fi-cats button.on{background:var(--verde);color:#fff;border-color:var(--verde)}
  .fi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:8px 16px 20px}
  @media(min-width:640px){.fi-grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:960px){.fi-grid{grid-template-columns:repeat(4,1fr);max-width:1100px;margin:0 auto}}
  .fi-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.06);cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}
  .fi-card:active{transform:scale(.98)}
  .fi-thumb{aspect-ratio:1;background:#fff;overflow:hidden}
  .fi-thumb img{width:100%;height:100%;object-fit:cover}
  .fi-cbody{padding:12px;display:flex;flex-direction:column;flex:1}
  .fi-cbody h3{font-size:.95rem;margin:0 0 2px}
  .fi-desc{font-size:.74rem;color:#888;margin:0 0 8px;flex:1}
  .fi-price{font-weight:700;color:var(--verde-osc);font-size:1.05rem}
  .fi-price small{font-weight:400;color:#999;font-size:.72rem}
  .fi-add{margin-top:10px;background:var(--verde-claro);color:var(--verde-osc);border:none;padding:9px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.85rem}
  .fi-add:active{background:var(--verde);color:#fff}
  .fi-empty,.fi-hint{text-align:center;color:#999;padding:20px;font-size:.88rem}
  .fi-hint{padding:8px 0}
  .fi-view{max-width:640px;margin:0 auto;padding:16px}
  .fi-back{background:none;border:none;color:var(--verde);font-weight:600;cursor:pointer;padding:8px 0;font-size:.95rem}
  .fi-detail-img{aspect-ratio:1;max-width:340px;margin:6px auto 16px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.06)}
  .fi-detail-img img{width:100%;height:100%;object-fit:cover}
  h2.fi-t{margin:0 0 6px;color:var(--verde-osc)}
  .fi-desc-big{color:#666;margin:0 0 14px}
  .fi-price-big{font-size:1.6rem;font-weight:800;color:var(--verde-osc);margin-bottom:18px}
  .fi-price-big small{font-size:.9rem;color:#999;font-weight:400}
  .fi-qty{display:flex;align-items:center;gap:18px;margin-bottom:14px}
  .fi-qty button{width:44px;height:44px;border-radius:50%;border:1px solid var(--verde);background:#fff;color:var(--verde);font-size:1.4rem;cursor:pointer}
  .fi-qty span{font-weight:700;font-size:1.1rem;min-width:90px;text-align:center}
  .fi-subtotal{margin-bottom:18px;color:#444}
  .fi-bigbtn{width:100%;background:var(--verde);color:#fff;border:none;padding:15px;border-radius:14px;font-size:1.02rem;font-weight:700;cursor:pointer}
  .fi-bigbtn:disabled{background:#bbb;cursor:not-allowed}
  .fi-cartbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--verde-osc);color:#fff;border:none;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:700;cursor:pointer;font-size:.95rem;box-shadow:0 -3px 16px rgba(0,0,0,.15)}
  .fi-order-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eee}
  .fi-order-row img{width:48px;height:48px;border-radius:10px;object-fit:cover}
  .fi-or-info{flex:1}.fi-or-info b{display:block;font-size:.92rem}.fi-or-info small{color:#888}
  .fi-totals{background:var(--verde-claro);border-radius:14px;padding:14px;margin:14px 0}
  .fi-totals div{display:flex;justify-content:space-between;padding:4px 0;font-size:.92rem;color:#555}
  .fi-grand{font-weight:800;font-size:1.1rem;color:var(--verde-osc);border-top:1px dashed #bbb;margin-top:6px;padding-top:8px!important}
  .fi-view h3{margin:18px 0 10px;color:var(--verde-osc)}
  .fi-view input,.fi-view select{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:12px;font-size:.95rem;margin-bottom:10px;outline:none}
  .fi-view input:focus,.fi-view select:focus{border-color:var(--verde)}
  .fi-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
  .fi-modal-card{background:#fff;border-radius:20px;padding:30px;max-width:380px;text-align:center}
  .fi-check{width:64px;height:64px;border-radius:50%;background:var(--verde);color:#fff;font-size:2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .fi-modal-card h2{color:var(--verde-osc);margin:0 0 10px}
  .fi-muted{color:#888;font-size:.88rem;margin:8px 0 18px}
  .fi-admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
  .fi-admin-head h2{margin:0;color:var(--verde-osc)}
  .fi-admin-head p{margin:2px 0 0;color:#888;font-size:.85rem}
  .fi-newbtn{background:var(--verde);color:#fff;border:none;padding:11px 16px;border-radius:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  .fi-admin-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .fi-admin-row img{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#fff}
  .fi-ar-info{flex:1;min-width:0}.fi-ar-info b{display:block}.fi-ar-info small{color:#888}
  .fi-ar-actions{display:flex;gap:6px}
  .fi-edit{background:var(--verde-claro);color:var(--verde-osc);border:none;padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.85rem}
  .fi-del{background:#fde8e8;color:#c0392b;border:none;padding:9px 11px;border-radius:10px;cursor:pointer;font-size:.85rem}
  label.fi-l{display:block;font-weight:600;font-size:.85rem;color:#444;margin:8px 0 4px}
  .fi-form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  @media(max-width:480px){.fi-form-row{grid-template-columns:1fr}}
  .fi-form-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fi-imgbox{aspect-ratio:1;max-width:240px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid #eee;display:flex;align-items:center;justify-content:center;margin:4px 0}
  .fi-imgbox img{width:100%;height:100%;object-fit:cover}
  .fi-img-actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .fi-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#262626;color:#fff;padding:10px 20px;border-radius:30px;font-size:.88rem;z-index:70;box-shadow:0 4px 16px rgba(0,0,0,.25)}
  .fi-tag{display:inline-block;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--verde-claro);color:var(--verde-osc);margin-left:6px}
  .fi-banner{background:#fff8e1;border:1px solid #ffe082;color:#8a6d3b;padding:10px 14px;border-radius:12px;font-size:.84rem;margin:0 16px 8px}
  .fi-step{margin-top:10px;display:flex;align-items:center;justify-content:space-between;background:var(--verde-claro);border-radius:10px;padding:3px}
  .fi-step button{width:36px;height:34px;border:none;border-radius:8px;background:var(--verde);color:#fff;font-size:1.25rem;font-weight:700;cursor:pointer;line-height:1}
  .fi-step span{font-weight:800;color:var(--verde-osc);font-size:.9rem}
  .fi-asearch{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:30px;font-size:.92rem;margin-bottom:12px;outline:none}
  .fi-pedido{cursor:pointer;transition:box-shadow .15s}
  .fi-pedido:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}
  .fi-tablewrap{overflow-x:auto;margin:12px 0;border:1px solid #e6e6e6;border-radius:12px}
  .fi-ptable{border-collapse:collapse;font-size:.9rem;min-width:100%}
  .fi-ptable th{background:var(--verde-claro);color:var(--verde-osc);text-align:left;padding:10px 12px;white-space:nowrap;position:sticky;left:0}
  .fi-ptable td{padding:10px 12px;border-left:1px solid #eee;white-space:nowrap;text-align:center}
  .fi-ptable tr+tr td,.fi-ptable tr+tr th{border-top:1px solid #eee}
  .fi-sortsel{padding:7px 10px;border:1px solid #ddd;border-radius:10px;font-size:.85rem;background:#fff}
  .fi-legalinfo{font-size:.8rem;color:#777;margin:4px 0 10px;line-height:1.45}
  .fi-legalchk{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:#444;margin:6px 0 14px;cursor:pointer}
  .fi-legalchk input{width:20px;height:20px;margin:1px 0 0;flex-shrink:0;accent-color:var(--verde)}
  .fi-legalchk a,.fi-flinks a,.fi-legalbody a{color:var(--verde-osc);font-weight:600}
  .fi-footer{max-width:1100px;margin:30px auto 0;padding:22px 16px 30px;border-top:1px solid #e6e6e6;font-size:.82rem;color:#666;display:flex;flex-direction:column;gap:8px;text-align:center}
  .fi-flinks{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center}
  .fi-legalcard{background:#fff;border-radius:18px;max-width:720px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
  .fi-legalhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #eee}
  .fi-legalhead h2{margin:0;font-size:1.15rem;color:var(--verde-osc)}
  .fi-legalx{border:none;background:#f2f2f2;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem}
  .fi-legalbody{padding:6px 20px 20px;overflow-y:auto;font-size:.9rem;line-height:1.55;color:#333}
  .fi-legalbody h4{margin:16px 0 4px;color:var(--verde-osc)}
  .fi-credits{font-size:.78rem;padding-left:18px;word-break:break-word}
  .fi-gal{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
  .fi-gtile{position:relative;width:76px;height:76px;padding:0;border:2px solid #e3e3e3;border-radius:12px;overflow:hidden;background:#fff;cursor:pointer}
  .fi-gtile img{width:100%;height:100%;object-fit:cover;display:block}
  .fi-gtile.on{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-claro)}
  .fi-gtile.on::after{content:"✓";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--verde);color:#fff;font-size:.75rem;line-height:20px;text-align:center}
  .fi-gtile span{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.88);font-size:.62rem;font-weight:700;color:#444;padding:2px 0}
  .fi-tabs{display:flex;gap:6px;border-bottom:2px solid #eee;margin:4px 0 14px}
  .fi-tabs button{border:none;background:none;padding:10px 16px;font-weight:700;font-size:.95rem;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
  .fi-tabs button.on{color:var(--verde-osc);border-bottom-color:var(--verde)}
  .fi-tabs button span{display:inline-block;min-width:22px;padding:1px 7px;margin-left:4px;border-radius:20px;background:var(--verde-claro);color:var(--verde-osc);font-size:.75rem}
  .fi-tabbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;color:#888;font-size:.85rem}
  .fi-ped-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:2px}
  .fi-pedido{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);font-size:.9rem}
  .fi-pedido b{color:var(--verde-osc)}
  .fi-pedido .li{color:#555;font-size:.85rem;padding:2px 0}
  .fi-load{text-align:center;color:#999;padding:40px;font-size:.9rem}
</style>

async function cargarProductos(){

  var r=await sb.from("productos").select("id,nombre,cat,precio,unidad,img,descripcion,forma,color,orden,creado").order("orden",{ascending:true,nullsFirst:false}).order("creado",{ascending:true}).order("nombre",{ascending:true});

  S.products=(r.data||[]).map(function(p){return {id:p.id,nombre:p.nombre,cat:p.cat,precio:Number(p.precio),unidad:p.unidad,img:p.img||"",desc:p.descripcion||"",forma:p.forma||"auto",color:p.color||"auto"};});
}
async function cargarPedidos(){

 privacidad:{t:"Política de privacidad",h:function(){return ''+
  '<p>Conforme al Reglamento (UE) 2016/679 (RGPD) y la Ley Orgánica 3/2018 (LOPDGDD), te informamos del tratamiento de tus datos personales.</p>'+

  '<h4>5. Conservación</h4><p>Durante la relación comercial y, después, durante los plazos legales de prescripción (hasta 6 años por obligaciones mercantiles, art. 30 del Código de Comercio, y 4 años por obligaciones tributarias). Después se suprimen.</p>'+
  '<h4>6. Destinatarios y encargados del tratamiento</h4><p>No cedemos tus datos a terceros salvo obligación legal. Utilizamos proveedores que tratan datos por cuenta del responsable: Supabase (base de datos, servidores en la Unión Europea, Irlanda) y GitHub Pages (alojamiento de la web). Las fotografías se cargan desde Wikimedia Commons, que recibe la dirección IP del visitante al servirlas. Cuando algún proveedor pueda acceder a datos desde fuera del Espacio Económico Europeo, se hace con las garantías del RGPD (cláusulas contractuales tipo o Marco de Privacidad de Datos UE-EE. UU.).</p>'+
  '<h4>7. Tus derechos</h4><p>Puedes ejercer los derechos de acceso, rectificación, supresión, oposición, limitación del tratamiento y portabilidad escribiendo a '+TITULAR.email+', indicando qué derecho ejerces. Si consideras que no se han atendido correctamente, puedes reclamar ante la Agencia Española de Protección de Datos (<a href="https://www.aepd.es" target="_blank" rel="noopener">www.aepd.es</a>).</p>'+
  '<h4>8. Seguridad</h4><p>Los datos de los pedidos solo son accesibles para la cuenta de la tienda, con conexión cifrada (HTTPS) y control de acceso en la base de datos.</p>'+
  '<p class="fi-muted">Última actualización: '+FECHA_LEGAL+'.</p>';}},
 cookies:{t:"Política de cookies",h:function(){return ''+
  '<p>Conforme al artículo 22.2 de la LSSI-CE, te informamos de que este sitio <b>no utiliza cookies publicitarias, analíticas ni de seguimiento</b>.</p>'+

  '<p>Al cargar las fotografías, Wikimedia Commons recibe la dirección IP del visitante para servirlas, sin instalar cookies de seguimiento en este sitio.</p>'+

function footer(){return '<footer class="fi-footer"><div><b>Frutas Insha 3 Allah</b> · Tetuán, Madrid · Precios con IVA incluido</div>'+
  '<div class="fi-flinks"><a href="#" data-legal="aviso">Aviso legal</a><a href="#" data-legal="condiciones">Condiciones de contratación</a><a href="#" data-legal="privacidad">Privacidad</a><a href="#" data-legal="cookies">Cookies</a></div>'+
  '<div class="fi-muted">© 2026 '+TITULAR.nombre+'</div></footer>';}
function showLegal(k){var d=LEGAL[k];if(!d)return;var m=document.createElement("div");m.className="fi-modal";
  m.innerHTML='<div class="fi-legalcard" role="dialog" aria-label="'+d.t+'"><div class="fi-legalhead"><h2>'+d.t+'</h2><button class="fi-legalx" aria-label="Cerrar">✕</button></div><div class="fi-legalbody">'+d.h()+'</div></div>';
  m.onclick=function(e){if(e.target===m||e.target.classList.contains("fi-legalx"))m.remove();};document.body.appendChild(m);}
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("[data-legal]");if(!a)return;e.preventDefault();e.stopPropagation();showLegal(a.getAttribute("data-legal"));},true);

function reducirFoto(file,max,q){return new Promise(function(ok,ko){var u=URL.createObjectURL(file);var im=new Image();
  im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));var c=document.createElement("canvas");
    c.width=Math.round(w*k);c.height=Math.round(h*k);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",q));};
  im.onerror=function(){URL.revokeObjectURL(u);ko();};im.src=u;});}

var CAT_NOMBRE={fruta:"fruta frutas",verdura:"verdura verduras hortalizas",setas:"setas seta champiñones hongos",cesta:"cestas cesta cajas caja regalo"};
function norm(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
function textoBusqueda(p){return norm(p.nombre+" "+(p.desc||"")+" "+(CAT_NOMBRE[p.cat]||p.cat));}

function fotoOriginal(nombre){for(var i=0;i<SEED.length;i++)if(SEED[i].nombre===nombre)return SEED[i].img||"";return "";}
function uniq(a){var o=[];a.forEach(function(x){if(x&&o.indexOf(x)<0)o.push(x);});return o;}
async function cargarFotos(id){
  if(!configurado)return;var r=await sb.from("productos").select("fotos").eq("id",id).single();
  if(S.editId!==id)return;S._fotos=(!r.error&&r.data&&Array.isArray(r.data.fotos))?r.data.fotos:[];render();}
function galeriaLista(){var p=S.editId?find(S.editId):null;
  return uniq([p?fotoOriginal(p.nombre):""].concat(S._fotos||[],[p?p.img:"",S._f?S._f.img:""]));}
function fotosParaGuardar(nueva){var p=S.editId?find(S.editId):null;var l=uniq((S._fotos||[]).concat([p?p.img:"",nueva]));
  if(l.length>8)l=[l[0]].concat(l.slice(-7));return l;}
function galeriaHTML(f){var g=galeriaLista();S._gal=g;
  var tiles=g.map(function(u,i){return '<button type="button" class="fi-gtile'+(u===f.img?' on':'')+'" data-pick="'+i+'" title="Usar esta foto"><img src="'+u+'" alt=""></button>';}).join("");
  var ilu='<button type="button" class="fi-gtile'+(!f.img?' on':'')+'" data-pick="-1" title="Usar ilustración"><img src="'+artFor(f.nombre,f.cat,f.desc,{shape:f.forma,color:f.color})+'" alt=""><span>Ilustración</span></button>';
  var cargando=(S.editId&&S._fotos===null)?'<span class="fi-hint">Cargando fotos anteriores…</span>':'';
  return '<label class="fi-l">Fotos guardadas de este producto <small style="font-weight:400;color:#888">(pulsa una para usarla)</small></label><div class="fi-gal">'+tiles+ilu+'</div>'+cargando;}
function cartbar(){return '<button class="fi-cartbar" data-checkout="1"><span>🛒 '+cartCount()+' producto'+(cartCount()>1?"s":"")+'</span><span>'+money(cartTotal())+' · Tramitar pedido →</span></button>';}

/* ============ EVENTOS ============ */
function syncForm(){var f=S._f;if(!f)return;var g=function(id){return document.getElementById(id);};if(g("f_nombre"))f.nombre=g("f_nombre").value;if(g("f_desc"))f.desc=g("f_desc").value;if(g("f_precio"))f.precio=g("f_precio").value;if(g("f_unidad"))f.unidad=g("f_unidad").value;if(g("f_cat"))f.cat=g("f_cat").value;if(g("f_forma"))f.forma=g("f_forma").value;if(g("f_color"))f.color=g("f_color").value;}
function updatePreview(){var f=S._f;if(!f)return;var prev=document.getElementById("f_prev");if(!prev)return;prev.src=f.img||artFor(f.nombre,f.cat,f.desc,{shape:f.forma,color:f.color});}
function bind(){
  app.querySelectorAll("[data-view]").forEach(function(b){b.onclick=function(){S.view=b.getAttribute("data-view");S.screen="shop";S.editId=null;S.adding=false;S._f=null;if(S.view==="admin"&&S.user){cargarPedidos().then(render);return;}render();};});
  var home=app.querySelector('[data-act="home"]');if(home)home.onclick=function(){S.view="tienda";S.screen="shop";render();};
  app.querySelectorAll("[data-cat]").forEach(function(b){b.onclick=function(){S.cat=b.getAttribute("data-cat");render();};});
  app.querySelectorAll("[data-open]").forEach(function(c){c.onclick=function(e){if(e.target.closest&&e.target.closest("[data-sw]"))return;S.detailId=c.getAttribute("data-open");S._qty=null;S.screen="detail";render();};});
  app.querySelectorAll("[data-add]").forEach(function(b){b.onclick=function(e){e.stopPropagation();var id=b.getAttribute("data-add");S.cart[id]=(S.cart[id]||0)+1;toast("Añadido al carrito");render();};});
  app.querySelectorAll("[data-back]").forEach(function(b){b.onclick=function(){var to=b.getAttribute("data-back");if(to==="admin"){S.editId=null;S.adding=false;S._f=null;S.view="admin";S.screen="shop";render();}else{S.screen=to;render();}};});
  var q=document.getElementById("q");if(q)q.oninput=function(){S.search=q.value;var pos=q.selectionStart;render();var nq=document.getElementById("q");if(nq){nq.focus();try{nq.setSelectionRange(pos,pos);}catch(e){}}};
  var p=find(S.detailId);
  app.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){var step=p&&p.unidad==="kg"?0.5:1;if(b.getAttribute("data-q")==="+")S._qty=+(S._qty+step).toFixed(1);else S._qty=Math.max(step,+(S._qty-step).toFixed(1));document.getElementById("qv").textContent=S._qty+" "+p.unidad;document.getElementById("sub").textContent=money(p.precio*S._qty);};});
  var aq=app.querySelector("[data-addq]");if(aq)aq.onclick=function(){var id=aq.getAttribute("data-addq");S.cart[id]=(S.cart[id]||0)+S._qty;toast("Añadido al carrito");S.screen="shop";render();};
  var cb=app.querySelector("[data-checkout]");if(cb)cb.onclick=function(){S.screen="checkout";render();};
  var cf=app.querySelector("[data-confirm]");if(cf)cf.onclick=async function(){var n=document.getElementById("c_nombre").value.trim(),tel=document.getElementById("c_tel").value.trim(),dir=document.getElementById("c_dir").value.trim(),pago=document.getElementById("c_pago").value;if(!n||!tel||!dir){toast("Completa nombre, teléfono y dirección");return;}if(!document.getElementById("c_ok").checked){toast("Debes aceptar las condiciones para hacer el pedido");return;}cf.disabled=true;cf.textContent="Enviando…";var items=cartItems();var total=cartTotal();var envio=total>=25?0:2.5;var ok=await enviarPedido({nombre:n,tel:tel,dir:dir,pago:pago},items,total,envio);if(ok){S.cart={};S.screen="shop";render();showConfirm(n,dir,tel);}else{cf.disabled=false;cf.textContent="Confirmar pedido";}};
  // login
  var lg=app.querySelector("[data-login]");if(lg)lg.onclick=async function(){var em=document.getElementById("l_email").value.trim();var pw=document.getElementById("l_pass").value;var msg=document.getElementById("l_msg");if(!configurado){msg.textContent="Configura Supabase primero.";return;}lg.disabled=true;lg.textContent="Entrando…";var r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error){msg.textContent="No se pudo entrar: "+r.error.message;lg.disabled=false;lg.textContent="Entrar";return;}S.user=r.data.user;await cargarPedidos();render();};
  app.querySelectorAll("[data-atab]").forEach(function(b){b.onclick=function(){S.adminTab=b.getAttribute("data-atab");S.pedidoId=null;render();};});
  app.querySelectorAll("[data-ped]").forEach(function(c){c.onclick=function(){S.pedidoId=c.getAttribute("data-ped");render();window.scrollTo(0,0);};});
  var pb=app.querySelector("[data-pback]");if(pb)pb.onclick=function(){S.pedidoId=null;render();};
  var ps=document.getElementById("psort");if(ps)ps.onchange=function(){S.pedSort=ps.value;render();};
  var aqs=document.getElementById("aq");if(aqs)aqs.oninput=function(){S.adminQ=aqs.value;var pos=aqs.selectionStart;render();var n=document.getElementById("aq");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}};
  var rf=app.querySelector("[data-refresh]");if(rf)rf.onclick=async function(){rf.disabled=true;rf.textContent="Actualizando…";await cargarPedidos();render();};
  var lo=app.querySelector("[data-logout]");if(lo)lo.onclick=async function(){await sb.auth.signOut();S.user=null;render();};
  // admin/form
  var nw=app.querySelector("[data-new]");if(nw)nw.onclick=function(){S.adminTab="productos";S._fotos=[];S.adding=true;S.editId=null;S._f=null;render();};
  app.querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){var id=b.getAttribute("data-edit");S.editId=id;S.adding=false;S._f=null;S._fotos=null;render();cargarFotos(id);};});
  app.querySelectorAll("[data-del]").forEach(function(b){b.onclick=async function(){var id=b.getAttribute("data-del");b.disabled=true;var ok=await borrarProducto(id);await cargarProductos();render();if(ok)toast("Producto borrado");};});
  ["f_nombre","f_desc","f_cat","f_forma","f_color"].forEach(function(id){var el=document.getElementById(id);if(el){el.oninput=function(){syncForm();updatePreview();};el.onchange=function(){syncForm();updatePreview();};}});
  var up=app.querySelector("[data-upload]");if(up)up.onclick=function(){document.getElementById("f_file").click();};
  var file=document.getElementById("f_file");if(file)file.onchange=function(e){var fl=e.target.files[0];if(!fl)return;if(!/^image\//.test(fl.type)){toast("El archivo no es una imagen");return;}toast("Procesando foto…");
    reducirFoto(fl,900,0.82).then(function(url){syncForm();S._f.img=url;render();}).catch(function(){toast("No se pudo leer la foto. Prueba con otra (JPG o PNG).");});};
  app.querySelectorAll("[data-pick]").forEach(function(b){b.onclick=function(){syncForm();var g=S._gal||[];S._f.img=g[+b.getAttribute("data-pick")]||"";render();};});
  var ci=app.querySelector("[data-clearimg]");if(ci)ci.onclick=function(){syncForm();S._f.img="";render();};
  var sv=app.querySelector("[data-save]");if(sv)sv.onclick=async function(){syncForm();var f=S._f;var esNuevo=!S.editId;var prod={id:S.editId,nombre:(f.nombre||"").trim()||"Producto",desc:(f.desc||"").trim(),precio:parseFloat(f.precio)||0,unidad:f.unidad,cat:f.cat,forma:f.forma,color:f.color,img:f.img,fotos:fotosParaGuardar(f.img)};sv.disabled=true;sv.textContent="Guardando…";var ok=await guardarProducto(prod,esNuevo);if(ok){await cargarProductos();S.editId=null;S.adding=false;S._f=null;render();toast(esNuevo?"Producto publicado":"Producto actualizado");}else{sv.disabled=false;sv.textContent="Guardar";}};
}
function showConfirm(nombre,dir,tel){var m=document.createElement("div");m.className="fi-modal";m.innerHTML='<div class="fi-modal-card"><div class="fi-check">✓</div><h2>¡Pedido confirmado!</h2><p>Gracias, <b>'+esc(nombre)+'</b>. Te lo llevamos a <b>'+esc(dir)+'</b>.</p><p class="fi-muted">Te llamaremos al '+esc(tel)+' para confirmar la entrega.</p><button class="fi-bigbtn">Seguir comprando</button></div>';m.onclick=function(e){if(e.target===m||e.target.tagName==="BUTTON")m.remove();};document.body.appendChild(m);}

/* ============ ARRANQUE ============ */
(async function(){
  await initAuth();
  await cargarProductos();
  if(S.user)await cargarPedidos();
  render();
})();
</script>
